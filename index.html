.art{width:100%;max-width:416px;height:auto;display:block}
.g{fill:var(--grid)}

.dash{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 7}
.disc{fill:var(--disc);stroke:var(--acc);stroke-width:2}
.line{fill:none;stroke:var(--ink);stroke-width:2}
.n-ink{fill:var(--ink)}.n-acc{fill:var(--acc)}.n-gold{fill:var(--acc2)}
.ring2{fill:none;stroke:var(--acc2);stroke-width:2}
footer.wrap{padding-top:24px;padding-bottom:36px;border-top:1px solid var(--grid);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:15px;color:var(--muted)}
